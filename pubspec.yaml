name: linguagens
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  video_player: ^2.14.1
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/fruits/
    - assets/images/background/
    # Sons das Letras: foto real da boca, deformada pra cada som. Ver AGENTS.md.
    - assets/images/mouth/
    # Sons das Letras: um vídeo por letra (a.mp4 ... z.mp4). Ver AGENTS.md.
    - assets/videos/letters/
    # Áudio do som de cada letra (a.mp3 ... z.mp3) e das palavras de exemplo
    # (<id da palavra>.mp3). Ver AGENTS.md.
    - assets/audio/letters/
    - assets/audio/words/
    # Efeitos sonoros (WAV) e músicas de fundo (MP3 em loop), CC0. Fora de
    # assets/audio/ de propósito: lá todo .mp3 precisa de curva de volume pra
    # boca (lip_sync_test). Origem e licenças no AGENTS.md.
    - assets/sfx/
    - assets/music/
    # Falas do Complete a Palavra (voz Yara): nome de cada letra, as palavras
    # das fases e as comemorações. Ver AGENTS.md.
    - assets/voice/letter_names/
    - assets/voice/words/
    - assets/voice/cheers/
